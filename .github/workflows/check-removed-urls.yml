name: Check for removed URLs

on:
  workflow_call:
  pull_request:
    branches: [main]

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          # This implicitly gets the PR branch. Making it explicit causes problems
          # with private forks, but it is equivalent to the following:
          # repository: ${{ github.event.pull_request.head.repo.full_name }}
          # ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          path: compare
      - name: Check out merge base in a worktree
        working-directory: compare
        run: |
          # pull_request.base.ref is the target branch (e.g. main); its tip
          # may include changes made after the PR diverged
          #  (merge_base)
          #       A --- B --- C  [main] (Tip of main)
          #      /
          #     /
          #    D --- E           [my-branch] (Tip of my-branch)
          merge_base=$(git merge-base HEAD "origin/${{ github.event.pull_request.base.ref }}")
          git worktree add --detach ../base "$merge_base"
      - name: Checkout sphinx-stack
        uses: actions/checkout@v5
        with:
          repository: canonical/sphinx-stack
          path: sphinx-stack
      - uses: actions/setup-python@v6
      - name: Build docs
        run: |
          for dir in compare base; do
            pushd ${dir}/docs
            make html
            popd
          done
      - name: Generate current URLs list
        run: |
          for dir in compare base; do
            build_dir="${dir}/docs/_build"
            urls_file="${dir}/docs/urls.txt"

            if [ ! -d "${build_dir}" ]; then
              echo "Expected docs build directory not found: ${build_dir}"
              exit 1
            fi

            find "${build_dir}" -name '*.html' \
              | sed "s|^${build_dir}||;s|^/html||;s|/index.html$|/|;s|.html$||" \
              | sort > "${urls_file}"
          done
      - name: Compare URLs
        run: python3 sphinx-stack/docs/_dev/check_removed_urls.py
